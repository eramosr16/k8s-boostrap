cluster:
  domain: cluster.local
  region: us-east-1
  # IP for the auth.<cluster-domain> alias (match the ClusterIP in the infra namespace)
  hostIP: 192.168.1.85

k3s:
  disable: []
  serverFlags: []

traefik:
  email: admin@example.com

images:
  keycloak: "26"
  postgres: "18"
  redis: "8"
  rabbitmq: "4-management-alpine"
  grafana: "10.2.0"
  opentelemetry: "0.102.0"
  headlamp: latest
  loki: "2.9.2"
  promtail: "2.9.2"
  prometheus: v2.45.0
  ecr_credential_provider: v1.0.0
  hello_world: latest

keycloak:
  realm: infra

routes:
  argocd: argocd
  grafana: grafana
  headlamp: infra
  keycloak: auth
  loki: logs

services:
  namespace: infra
