apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-config
  namespace: kube-system
data:
  traefik.yaml: |
    api:
      dashboard: true
      insecure: true
    certificatesResolvers:
      letsencrypt:
        acme:
          email: "LETS_ENCRYPT_EMAIL"
          storage: /letsencrypt/acme.json
          httpChallenge:
            entryPoint: web
        # For production, remove the staging URL below
        # Let's Encrypt production URL: https://acme-v02.api.letsencrypt.org/directory
        # For testing, use staging to avoid rate limits:
        # caServer: https://acme-staging-v02.api.letsencrypt.org/directory
    entryPoints:
      web:
        address: ":80"
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
      websecure:
        address: ":443"
    providers:
      kubernetesCRD: {}
      kubernetesIngress: {}
    log:
      level: INFO
    accessLog: {}