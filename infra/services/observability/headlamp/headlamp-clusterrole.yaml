apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs:
      - get
      - list
      - watch
  - nonResourceURLs: ["*"]
    verbs:
      - get
      - list
      - watch
  - apiGroups: [""]
    resources: ["users", "groups"]
    verbs:
      - impersonate
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs:
      - create
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs:
      - create