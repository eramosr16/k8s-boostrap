apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: infra
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:2.9.2
          imagePullPolicy: Always
          args:
            - -config.file=/etc/promtail/promtail.yaml
          volumeMounts:
            - name: promtail-config
              mountPath: /etc/promtail
            - name: logs
              mountPath: /var/log
            - name: pod-logs
              mountPath: /var/log/pods
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 50Mi
              ephemeral-storage: 100Mi
            limits:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 500Mi
      volumes:
        - name: promtail-config
          configMap:
            name: promtail-config
        - name: logs
          hostPath:
            path: /var/log
        - name: pod-logs
          hostPath:
            path: /var/log/pods
