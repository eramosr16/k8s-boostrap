apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: infra
data:
  grafana.ini: |
    [server]
    http_port = 3000
    domain = metrics.mydomain.com
    root_url = https://metrics.mydomain.com
    
    [security]
    disable_gravatar = true
    
    [auth]
    disable_login_form = false
    disable_signout_menu = false
    
    [auth.generic_oauth]
    enabled = true
    name = Keycloak
    icon = signin
    client_id = grafana
    client_secret = ${GRAFANA_OIDC_CLIENT_SECRET}
    scopes = openid,profile,email
    auth_url = https://auth.mydomain.com/realms/master/protocol/openid-connect/auth
    token_url = https://auth.mydomain.com/realms/master/protocol/openid-connect/token
    api_url = https://auth.mydomain.com/realms/master/protocol/openid-connect/userinfo
    allow_sign_up = true
    role_attribute_path = contains(groups[*], 'grafana-admin') && 'Admin' || contains(groups[*], 'grafana-editor') && 'Editor' || 'Viewer'
    
    [auth.basic]
    enabled = false
    
    [users]
    allow_sign_up = false
    auto_assign_org = true
    auto_assign_org_role = Viewer
    
    [dashboards]
    default_home_dashboard_path = /var/lib/grafana/dashboards/default.json