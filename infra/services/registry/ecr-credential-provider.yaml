---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-secret-refresher
  namespace: infra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ecr-secret-refresher
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ecr-secret-refresher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ecr-secret-refresher
subjects:
  - kind: ServiceAccount
    name: ecr-secret-refresher
    namespace: infra
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: refresh-ecr-registry-secret
  namespace: infra
spec:
  schedule: "0 */10 * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: ecr-secret-refresher
          containers:
            - name: refresh
              image: public.ecr.aws/aws-cli/aws-cli:2.27.41
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: ecr-refresh-aws-creds
              command:
                - /bin/sh
                - -ec
                - >
                  ARCH="$(uname -m)"

                  case "$ARCH" in
                    x86_64) KARCH="amd64" ;;
                    aarch64|arm64) KARCH="arm64" ;;
                    *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
                  esac


                  curl -fsSL -o /usr/local/bin/kubectl \
                    "https://dl.k8s.io/release/v1.32.2/bin/linux/${KARCH}/kubectl"

                  chmod +x /usr/local/bin/kubectl


                  TOKEN="$(aws ecr get-login-password --region "${AWS_REGION}")"


                  kubectl create secret docker-registry ecr-registry \
                    --namespace default \
                    --docker-server="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" \
                    --docker-username=AWS \
                    --docker-password="${TOKEN}" \
                    --dry-run=client -o yaml | kubectl apply -f -
          restartPolicy: OnFailure
          terminationGracePeriodSeconds: 30
          dnsPolicy: ClusterFirst
