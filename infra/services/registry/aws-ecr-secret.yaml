---
apiVersion: v1
kind: Secret
metadata:
  name: ecr-registry
  namespace: kube-system
type: kubernetes.io/dockerconfigjson
stringData:
  # Generate with: aws ecr get-login-password --region <region> | docker login ...
  # Then encode: echo -n '{"auths":{"<account>.dkr.ecr.<region>.amazonaws.com":{"username":"AWS","password":"<token>"}}}' | base64 -w0
  # IMPORTANT: This is base64-encoded JSON, not plain text. See Readme.md for generation steps.
  .dockerconfigjson: <base64-encoded-dockerconfigjson>