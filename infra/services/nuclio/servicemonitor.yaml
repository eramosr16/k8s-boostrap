apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nuclio
  namespace: nuclio
  labels:
    app.kubernetes.io/name: nuclio
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nuclio
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - nuclio