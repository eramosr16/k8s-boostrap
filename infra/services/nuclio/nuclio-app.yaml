apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nuclio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/anomalyco/k8s-boostrap
    targetRevision: main
    path: infra/services/nuclio
    kustomize:
      images:
        - nuclio:latest
  destination:
    server: https://kubernetes.default.svc
    namespace: nuclio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true